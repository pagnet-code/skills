name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check out the CLI/bridge source (drift baseline)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pagnet-code/pagnet
          path: pagnet-upstream
          fetch-depth: 1
      - name: Validate skill, manifests, and no-drift
        run: python3 scripts/validate.py pagnet-upstream
